<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>시간의 마패</title>
  </head>
  <body>
    <main
      class="splash-shell"
      aria-label="시간의 마패 스플래시"
    >
      <button
        id="start-experience"
        class="splash-frame"
        type="button"
        aria-label="WebAR 체험 시작"
      >
        <img
          class="splash-bg"
          src="/assets/splash/splash-bg.png"
          alt=""
        />
        <img
          class="character"
          src="/assets/splash/character.png"
          alt=""
        />
        <span
          class="splash-gradient"
          aria-hidden="true"
        ></span>
        <img
          class="title-logo"
          src="/assets/splash/title-logo.png"
          alt="시간의 마패"
        />
        <img
          class="touch-button"
          src="/assets/splash/touch-button.png"
          alt="화면을 터치하세요!"
        />
        <img
          class="folk-village-logo"
          src="/assets/splash/folk-village-logo.png"
          alt="한국민속촌"
        />
        <img
          class="partner-logos"
          src="/assets/splash/partner-logos.png"
          alt=""
        />
      </button>
    </main>
    <main id="app-shell" hidden>
      <section id="overlay" class="overlay">
        <select
          id="scene-select"
          aria-label="개발용 공간 선택"
          hidden
        ></select>

        <img
          class="webar-logo"
          src="/assets/webar/Logo.png"
          alt="시간의 마패"
        />

        <section
          id="status-card"
          class="experience-guide status-pending"
        >
          <strong
            id="status-title"
            class="sr-only"
          ></strong>
          <p id="status-detail">
            휴대폰을 움직여<br />오늘 체험한 내용들을 살펴 보세요.
          </p>
          <button
            id="start-ar"
            class="retry-icon-button"
            type="button"
            disabled
            aria-label="공간 인식 다시 시도"
          >
            AR 준비 중
          </button>
        </section>

        <div class="actions">
          <button
            id="stop-ar"
            type="button"
            disabled
            aria-label="AR 종료"
          >
            종료
          </button>
        </div>
      </section>
    </main>
    <script
      type="module"
      src="/src/splash.js"
    ></script>
  </body>
</html>
