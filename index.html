<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>시간의 마패</title>
  </head>
  <body>
    <main class="splash-shell" aria-label="시간의 마패 스플래시">
      <button id="start-experience" class="splash-frame" type="button" aria-label="WebAR 체험 시작">
        <img class="splash-bg" src="/assets/splash/splash-bg.png" alt="" />
        <img class="character" src="/assets/splash/character.png" alt="" />
        <span class="splash-gradient" aria-hidden="true"></span>
        <img class="title-logo" src="/assets/splash/title-logo.png" alt="시간의 마패" />
        <img class="touch-button" src="/assets/splash/touch-button.png" alt="화면을 터치하세요!" />
        <img class="folk-village-logo" src="/assets/splash/folk-village-logo.png" alt="한국민속촌" />
        <img class="partner-logos" src="/assets/splash/partner-logos.png" alt="" />
      </button>
    </main>
    <script type="module" src="/src/splash.js"></script>
  </body>
</html>
