<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>용인민속촌 WebAR</title>
  </head>
  <body data-auto-boot-webar="true">
    <main id="app-shell">
      <section id="overlay" class="overlay">
        <select
          id="scene-select"
          aria-label="개발용 공간 선택"
          hidden
        ></select>

        <img
          class="webar-logo"
          src="/assets/webar/Logo.png"
          alt="시간의 마패"
        />

        <section
          id="status-card"
          class="experience-guide status-pending"
        >
          <strong
            id="status-title"
            class="sr-only"
          ></strong>
          <p id="status-detail">
            휴대폰을 움직여<br />오늘 체험한 내용들을 살펴 보세요.
          </p>
          <button
            id="start-ar"
            class="retry-icon-button"
            type="button"
            disabled
            aria-label="공간 인식 다시 시도"
          >
            AR 준비 중
          </button>
        </section>

        <div class="actions">
          <button
            id="stop-ar"
            type="button"
            disabled
            aria-label="AR 종료"
          >
            종료
          </button>
        </div>
      </section>
    </main>
    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
