<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>용인민속촌 WebAR</title>
  </head>
  <body>
    <main id="app-shell">
      <section id="overlay" class="overlay">
        <div class="top-panel">
          <div>
            <p class="eyebrow">Yongin Folk Village</p>
            <h1>민속촌 WebAR</h1>
          </div>
          <label class="scene-picker">
            <span>공간</span>
            <select id="scene-select"></select>
          </label>
        </div>

        <div id="status-card" class="status-card status-pending">
          <strong id="status-title">초기화 중</strong>
          <p id="status-detail">앱을 준비하고 있습니다.</p>
        </div>

        <div class="actions">
          <button id="start-ar" type="button" disabled>AR 시작</button>
          <button id="stop-ar" type="button" disabled>종료</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
